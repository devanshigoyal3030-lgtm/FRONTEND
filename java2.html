<!DOCTYPE html>
<html>
<head>
    <title>Age Eligibility Checker</title>
</head>
<body>
    <script>
        
        let age1 = prompt("Enter your age for if-else check:");
        age1 = Number(age1); 

        if (age1 >= 18) {
            alert("You are eligible to vote!");
            document.write("<h2>Using if-else: Eligible to vote </h2>");
        } else {
            alert("You are NOT eligible to vote.");
            document.write("<h2>Using if-else: Not eligible to vote </h2>");
        }

        document.write("<hr>"); 

        
        let age2 = prompt("Enter your age for ternary check:");
        age2 = Number(age2);

        let message = (age2 >= 18) 
            ? "Using ternary: Eligible to vote " 
            : "Using ternary: Not eligible to vote";

        alert(message);
        document.write("<h2>" + message + "</h2>");
    </script>
</body>
</html>
