<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" rx="12" fill="#F8FAFC"/>
  <!-- Browser Header -->
  <rect width="800" height="40" rx="12" fill="#E2E8F0"/>
  <rect y="30" width="800" height="10" fill="#E2E8F0"/>
  <circle cx="25" cy="20" r="6" fill="#EF4444"/>
  <circle cx="45" cy="20" r="6" fill="#F59E0B"/>
  <circle cx="65" cy="20" r="6" fill="#10B981"/>
  <rect x="90" y="10" width="450" height="20" rx="6" fill="#FFFFFF"/>
  <text x="105" y="24" font-family="sans-serif" font-size="11" fill="#64748B">https://website-architecture-analysis.demo</text>
  
  <!-- Architecture Diagram Graphic -->
  <rect x="50" y="70" width="700" height="350" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  
  <!-- Nodes -->
  <rect x="90" y="120" width="160" height="90" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="170" y="160" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E40AF" text-anchor="middle">Client Frontend</text>
  <text x="170" y="180" font-family="sans-serif" font-size="11" fill="#3B82F6" text-anchor="middle">DOM &amp; Navigation</text>

  <rect x="320" y="120" width="160" height="90" rx="8" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="400" y="160" font-family="sans-serif" font-size="14" font-weight="700" fill="#15803D" text-anchor="middle">Core Layout Router</text>
  <text x="400" y="180" font-family="sans-serif" font-size="11" fill="#22C55E" text-anchor="middle">Component Hierarchy</text>

  <rect x="550" y="120" width="160" height="90" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="630" y="160" font-family="sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">Assets &amp; Media</text>
  <text x="630" y="180" font-family="sans-serif" font-size="11" fill="#F59E0B" text-anchor="middle">Resource Pipeline</text>

  <!-- Connecting Lines -->
  <line x1="250" y1="165" x2="320" y2="165" stroke="#94A3B8" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="480" y1="165" x2="550" y2="165" stroke="#94A3B8" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- Lower Architecture Blocks -->
  <rect x="90" y="270" width="290" height="110" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="235" y="300" font-family="sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">UX &amp; Accessibility Flow</text>
  <rect x="110" y="320" width="250" height="12" rx="3" fill="#CBD5E1"/>
  <rect x="110" y="340" width="200" height="12" rx="3" fill="#CBD5E1"/>

  <rect x="420" y="270" width="290" height="110" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="565" y="300" font-family="sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">DOM Performance Audit</text>
  <rect x="440" y="320" width="250" height="12" rx="3" fill="#CBD5E1"/>
  <rect x="440" y="340" width="200" height="12" rx="3" fill="#CBD5E1"/>

  <text x="400" y="460" font-family="sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">Website Architecture Analysis Screenshot Placeholder</text>
</svg>
